name: Build and Release Mobile APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Added: Flutter requires Java to build Android apps
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.25.2
          if [ -f mobile/requirements.txt ]; then pip install -r mobile/requirements.txt; fi

      # Added: 'yes |' automatically answers 'y' to the installation prompt
      - name: Build APK
        working-directory: ./mobile
        run: |
          # Strip the 'v' from the tag (e.g., v1.2.3 becomes 1.2.3)
          VERSION=${GITHUB_REF_NAME#v}
          yes | flet build apk --project "Audit FAA" --module-name mobile_app --build-version $VERSION

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/apk/*.apk
          generate_release_notes: true
