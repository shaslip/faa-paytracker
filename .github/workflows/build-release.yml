name: Build and Release Mobile APK

on:
  push:
    tags:
      - 'v*' # Triggers only when you push a tag like "v1.2"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the GitHub Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet
          if [ -f mobile/requirements.txt ]; then pip install -r mobile/requirements.txt; fi

      - name: Build APK
        working-directory: ./mobile
        run: flet build apk --project "Audit FAA" --module-name mobile_app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/apk/app-release.apk
          generate_release_notes: true
